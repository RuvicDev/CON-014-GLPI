[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-glpi-connector"
version = "1.0.0"
description = "Conector Ruvic para gestión de tickets en GLPI"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3.0"]

[tool.setuptools.packages.find]
include = ["ruvic_glpi_connector*"]
